<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>iPhone - Apple</title>
    <script>
      (function () {
        var path = window.location.pathname;
        var narrow = window.matchMedia('(max-width: 768px)').matches;
        var mobileUa = /Android|webOS|iPhone|iPad|iPod|BlackBerry|IEMobile|Opera Mini/i.test(
          navigator.userAgent,
        );
        if (path === '/m' || path.indexOf('/m/') === 0) {
          window.location.replace('/mobile');
          return;
        }
        if (path === '/mobile' || path.indexOf('/mobile/') === 0) {
          if (!narrow && !mobileUa) {
            var meta = document.querySelector('meta[name="viewport"]');
            if (meta) {
              meta.setAttribute('content', 'width=430, initial-scale=1.0, viewport-fit=cover');
            }
          }
          return;
        }
        if (path !== '/' && path !== '') return;
        if (narrow || mobileUa) {
          window.location.replace('/mobile');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
